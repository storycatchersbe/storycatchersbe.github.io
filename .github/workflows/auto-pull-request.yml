name: Auto Pull Request

on:
  push:
    branches:
      - "cursor/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Create pull request
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace("refs/heads/", "");

            const { data: existing } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: "open",
            });

            if (existing.length > 0) {
              core.info(`Open PR already exists: ${existing[0].html_url}`);
              return;
            }

            const { data: comparison } = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: "main",
              head: branch,
            });

            const commits = comparison.commits ?? [];
            const latestMessage = commits.at(-1)?.commit?.message ?? branch;
            const title = latestMessage.split("\n")[0].trim();
            const body = [
              "## Summary",
              ...commits.map(
                (commit) => `- ${commit.commit.message.split("\n")[0].trim()}`
              ),
              "",
              "## Test plan",
              "- [ ] Controleer de wijzigingen op de preview-URL",
              "- [ ] Merge naar `main` om live te zetten op storycatchers.be",
            ].join("\n");

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              head: branch,
              base: "main",
              body,
            });

            core.info(`Created PR: ${pr.html_url}`);
